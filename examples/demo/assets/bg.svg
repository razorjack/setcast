<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <radialGradient id="glow" cx="62%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1b2a36"/>
      <stop offset="0.55" stop-color="#0b1016"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <linearGradient id="rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6a2b" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#ff6a2b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6a2b" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fd4e6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7fd4e6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#9fb4c4" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <pattern id="grid2" width="400" height="400" patternUnits="userSpaceOnUse">
      <path d="M400 0H0V400" fill="none" stroke="#9fb4c4" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 0.6  0 0 0 0 0.7  0 0 0 0 0.8  0 0 0 0.06 0"/>
    </filter>
    <filter id="blur40"><feGaussianBlur stdDeviation="40"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#grid2)"/>

  <g transform="rotate(-12 1250 400)">
    <rect x="900" y="120" width="1400" height="520" fill="#0e151c" stroke="#3a4b5a" stroke-opacity="0.5"/>
    <rect x="900" y="120" width="1400" height="2" fill="url(#steel)"/>
    <rect x="940" y="160" width="1320" height="440" fill="none" stroke="#7fd4e6" stroke-opacity="0.08"/>
  </g>

  <rect x="-200" y="640" width="2400" height="6" fill="url(#rust)" transform="rotate(-12 960 640)"/>
  <rect x="-200" y="660" width="2400" height="120" fill="#ff6a2b" fill-opacity="0.08" filter="url(#blur40)" transform="rotate(-12 960 660)"/>

  <circle cx="1500" cy="330" r="260" fill="#7fd4e6" fill-opacity="0.07" filter="url(#blur40)"/>
  <circle cx="1500" cy="330" r="180" fill="none" stroke="#7fd4e6" stroke-opacity="0.25" stroke-width="1"/>
  <circle cx="1500" cy="330" r="184" fill="none" stroke="#7fd4e6" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="6 14"/>

  <g fill="none" stroke="#9fb4c4" stroke-opacity="0.35">
    <path d="M120 120h40M120 120v40"/>
    <path d="M1800 120h-40M1800 120v40"/>
    <path d="M120 960h40M120 960v-40"/>
    <path d="M1800 960h-40M1800 960v-40"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="14" fill="#9fb4c4" fill-opacity="0.35" letter-spacing="3">
    <text x="1320" y="650">SYS.0174 // BLOCK B</text>
    <text x="260" y="250">LAT 52.2297 // LON 21.0122</text>
  </g>

  <rect width="1920" height="1080" filter="url(#grain)"/>
</svg>
