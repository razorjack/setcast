name: ci
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-manager: false
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp test
      - run: vp run ban-check
      - name: Smoke render (3 s of the demo, validates h264 + aac + motion)
        run: |
          sudo apt-get install -y -qq ffmpeg > /dev/null
          vp run demo-assets
          vp run smoke
      - name: Exporter acceptance (timing, readiness, themes, failure recovery)
        run: vp run export-acceptance
      - name: Install browser exporter runtime
        run: vp exec --filter @setcast/renderer-browser playwright install --with-deps chromium
      - name: Browser exporter acceptance and resume recovery
        run: |
          vp run export-acceptance --adapter ./packages/renderer-browser/src/export/index.ts --out examples/demo/out/browser-acceptance
          node packages/renderer-browser/bench/resume.ts
      - name: GPU visualizer determinism, failures and synthetic live input
        run: node packages/renderer-browser/bench/gpu.ts
      - name: Live output recovery and adaptive GPU resolution
        run: node packages/renderer-browser/bench/output.ts
      - name: Automatic live scene progression and replay
        run: node packages/renderer-browser/bench/sequence.ts
      - name: One-projector geometry, calibration and venue profiles
        run: node packages/renderer-browser/bench/projection.ts
      - name: Independent preview frames, comparison and recovery
        run: node packages/renderer-browser/bench/preview.ts
      - name: Energy-aware live scene selection
        run: node packages/renderer-browser/bench/energy.ts
      - name: Confidence-aware live beat tracking
        run: node packages/renderer-browser/bench/beats.ts
