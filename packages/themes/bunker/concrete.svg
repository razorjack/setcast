<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <!-- cast concrete: the streaks of the pour, sand grain, and sparse air pockets -->
  <filter id="concrete" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.004 0.012" numOctaves="5" seed="8" result="pour"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="2" result="grain"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="5" result="pocket-noise"/>
    <feComponentTransfer in="pocket-noise" result="pockets">
      <feFuncR type="linear" slope="6" intercept="-1.1"/>
      <feFuncG type="linear" slope="6" intercept="-1.1"/>
      <feFuncB type="linear" slope="6" intercept="-1.1"/>
    </feComponentTransfer>
    <feComposite in="pour" in2="grain" operator="arithmetic" k2="0.45" k3="0.3" k4="0.12" result="surface"/>
    <feComposite in="surface" in2="pockets" operator="arithmetic" k1="0.55" k2="0.45" result="pitted"/>
    <feColorMatrix in="pitted" type="matrix" values="0.74 0 0 0 0  0.72 0 0 0 0  0.68 0 0 0 0  0 0 0 0 1"/>
  </filter>
  <rect width="1200" height="675" filter="url(#concrete)"/>
</svg>
